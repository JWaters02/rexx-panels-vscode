<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example</title>
    <style>
        :root {
            --container-padding: 20px;
            --input-padding-vertical: 6px;
            --input-padding-horizontal: 4px;
            --input-margin-vertical: 10px;
            --input-margin-horizontal: 0;
        }

        body {
            padding: 0 var(--container-padding);
            color: var(--vscode-foreground);
            font-size: var(--vscode-font-size);
            font-weight: var(--vscode-font-weight);
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
        }

        ol,
        ul {
            padding-left: var(--container-padding);
        }

        body>*,
        form>* {
            margin-block-start: var(--input-margin-vertical);
            margin-block-end: var(--input-margin-vertical);
        }

        *:focus {
            outline-color: var(--vscode-focusBorder) !important;
        }

        a {
            color: var(--vscode-textLink-foreground);
        }

        a:hover,
        a:active {
            color: var(--vscode-textLink-activeForeground);
        }

        code {
            font-size: var(--vscode-editor-font-size);
            font-family: var(--vscode-editor-font-family);
        }

        button {
            border: none;
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            width: 100px;
            text-align: center;
            outline: 1px solid transparent;
            outline-offset: 2px !important;
            color: var(--vscode-button-foreground);
            background: var(--vscode-button-background);
        }

        button:hover {
            cursor: pointer;
            background: var(--vscode-button-hoverBackground);
        }

        button:focus {
            outline-color: var(--vscode-focusBorder);
        }

        button.secondary {
            color: var(--vscode-button-secondaryForeground);
            background: var(--vscode-button-secondaryBackground);
        }

        button.secondary:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        input:not([type='checkbox']),
        textarea {
            display: block;
            width: 65%;
            border: solid 1px var(--vscode-foreground);
            font-family: var(--vscode-font-family);
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            color: var(--vscode-input-foreground);
            outline-color: var(--vscode-input-border);
            background-color: var(--vscode-input-background);
        }

        input[type="checkbox"] {
            width: auto;
            margin: var(--input-margin-vertical) var(--input-margin-horizontal);
            accent-color: var(--vscode-input-foreground);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--vscode-input-placeholderForeground);
        }

        input,
        select {
            display: block;
            width: 100px;
            border: solid 1px var(--vscode-foreground);
            font-family: var(--vscode-font-family);
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            color: var(--vscode-input-foreground);
            outline-color: var(--vscode-input-border);
            background-color: var(--vscode-input-background);
        }
    </style>
</head>
<body>
    <h1>Example</h1>
    <form id="exampleForm">
        <h3 for="jobname">Job Name:</h3>
        <input id="jobname" type="text" placeholder="Enter job name used for submitting" />

        <h3 for="jobclass">Job Class:</h3>
        <select id="jobclass">
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
        </select>

        <h3 for="pdsname">PDS Name:</h3>
        <input id="pdsname" type="text" placeholder="Enter PDS name" />

        <h3 for="editjcl">Submit or Edit JCL:</h3>
        <select id="editjcl">
            <option value="N">Submit JCL</option>
            <option value="Y">Edit JCL</option>
        </select>

        <button type="submit">Submit</button>
    </form>
    <script>
        const vscode = acquireVsCodeApi();

        function getState() {
            return {
                jobname: document.getElementById("jobname").value,
                jobclass: document.getElementById("jobclass").value,
                pdsname: document.getElementById("pdsname").value,
                editjcl: document.getElementById("editjcl").value,
            };
        }

        function sendState() {
            const state = getState();
            vscode.postMessage({ command: 'updateState', state });
        }

        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('change', sendState);
        });

        document.getElementById("exampleForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const state = getState();
            vscode.postMessage({ command: 'submit', state });
        });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'restoreState') {
                const state = message.state;
                document.getElementById("jobname").value = state.jobname;
                document.getElementById("jobclass").value = state.jobclass;
                document.getElementById("pdsname").value = state.pdsname;
                document.getElementById("editjcl").value = state.editjcl;
            }
        });

        document.getElementById("jobname").value = '${defaultValues.jobname}';
        document.getElementById("jobclass").value = '${defaultValues.jobclass}';
        document.getElementById("pdsname").value = '${defaultValues.pdsname}';
        document.getElementById("editjcl").value = '${defaultValues.editjcl}';

        document.getElementById("jobname").placeholder = '${defaultValues.jobname}';
        document.getElementById("jobclass").placeholder = '${defaultValues.jobclass}';
        document.getElementById("pdsname").placeholder = '${defaultValues.pdsname}';
        document.getElementById("editjcl").placeholder = '${defaultValues.editjcl}';
    </script>
</body>
</html>
